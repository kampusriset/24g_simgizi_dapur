<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - MBG Food Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(251,191,36,.07), transparent);
      top: -80px; right: -80px;
    }
    body::after {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,.06), transparent);
      bottom: -60px; left: -60px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      transition: transform .3s;
    }

    .login-card:hover { transform: translateY(-4px); }

    .login-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #d4af37 100%);
      color: #fff;
      padding: 38px 24px 32px;
      text-align: center;
    }

    .header-icon-wrap {
      width: 70px; height: 70px;
      border-radius: 18px;
      background: rgba(255,255,255,.18);
      border: 2px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 16px;
    }

    .login-header h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
    .login-header p  { font-size: 13px; opacity: .88; margin: 0; }

    .login-body { padding: 32px 28px; }

    .form-label { font-weight: 700; font-size: 13px; color: #374151; margin-bottom: 6px; }

    .input-group-text {
      background: #f8fafc;
      border-color: #e5e7eb;
      color: #9ca3af;
    }

    .form-control {
      border-color: #e5e7eb;
      font-size: 14px;
      padding: 11px 14px;
    }

    .form-control:focus {
      border-color: #1e3a8a;
      box-shadow: 0 0 0 .2rem rgba(30,58,138,.15);
    }

    .btn-login {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      transition: all .25s;
      letter-spacing: .3px;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #162d70, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(30,58,138,.35);
    }

    .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
    .divider hr { flex: 1; border-color: #e5e7eb; opacity: 1; }
    .divider span { font-size: 12px; color: #9ca3af; white-space: nowrap; }

    .demo-badge {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: #0369a1;
    }

    .demo-badge strong { display: block; font-weight: 700; color: #0c4a6e; margin-bottom: 4px; }

    .login-footer {
      background: #f8fafc;
      border-top: 1px solid #f1f5f9;
      padding: 14px 24px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }

    .alert-danger { font-size: 13px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-card">
      <div class="login-header">
        <div class="header-icon-wrap">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <h1>MBG Food Hub</h1>
        <p>Sistem Informasi Manajemen Gizi</p>
      </div>

      <div class="login-body">
        <div class="alert alert-danger d-none" id="loginError">
          <i class="fa-solid fa-triangle-exclamation me-2"></i>Username atau password salah.
        </div>

        <div class="mb-3">
          <label class="form-label" for="username">
            <i class="fa-solid fa-user me-1 text-muted"></i>Username
          </label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock me-1 text-muted"></i>Password
          </label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="doLogin()">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk ke Sistem
        </button>

        <div class="divider"><hr><span>akun demo</span><hr></div>

        <div class="demo-badge">
          <strong><i class="fa-solid fa-info-circle me-1"></i>Kredensial Demo</strong>
          Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
        </div>
      </div>

      <div class="login-footer">
        &copy; 2026 MBG Food Hub · Developed by <strong>4ThinkzTeam</strong>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    });
    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const err = document.getElementById('loginError');

      if (u === 'admin' && p === 'admin123') {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', u);
        localStorage.setItem('loginTime', new Date().toISOString());
        err.classList.add('d-none');
        window.location.href = 'dashboard.html';
      } else {
        err.classList.remove('d-none');
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
